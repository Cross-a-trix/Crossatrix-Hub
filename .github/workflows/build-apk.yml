name: Build Android APK from APP.zip

on:
  push:
    paths:
      - 'APP.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Extract APP.zip
        run: |
          mkdir -p extracted_app
          unzip -q APP.zip -d extracted_app

      - name: Build APKs (Debug & Release)
        run: |
           # Find the directory containing the Android project files
           PROJECT_FILE=$(find extracted_app \( -name "settings.gradle*" -o -name "build.gradle*" \) | head -n 1)

           if [ -z "$PROJECT_FILE" ]; then
             echo "Error: No Android project files found inside APP.zip!"
             echo "Top-level extracted_app contents:"
             find extracted_app -maxdepth 3 -type f | head -n 50
             exit 1
           fi

           PROJECT_DIR=$(dirname "$PROJECT_FILE")
           echo "Found project directory at: $PROJECT_DIR"
           cd "$PROJECT_DIR"

           # If gradlew doesn't exist, download Gradle and generate the wrapper automatically
           if [ ! -f "gradlew" ]; then
             echo "gradlew not found. Generating wrapper..."
             # Download Gradle 8.9 (compatible with modern Android projects)
             wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
             unzip -q gradle-8.9-bin.zip
             export PATH="$PWD/gradle-8.9/bin:$PATH"

             # Generate the wrapper files
             gradle wrapper --gradle-version 8.9
           fi

           chmod +x gradlew

           # Compile both variants
           ./gradlew assembleDebug assembleRelease

      - name: Sign Release APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Add the ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${ANDROID_KEY_ALIAS:?Add the ANDROID_KEY_ALIAS repository secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Add the ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${ANDROID_KEY_PASSWORD:?Add the ANDROID_KEY_PASSWORD repository secret}"

          keystore="$RUNNER_TEMP/release-keystore.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          shopt -s globstar nullglob
          apks=(extracted_app/**/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "Error: No release APKs found to sign."
            exit 1
          fi

          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in "${apks[@]}"; do
            signed_apk="${apk%.apk}-signed.apk"
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed_apk" \
              "$apk"
            "$apksigner" verify "$signed_apk"
            mv "$signed_apk" "$apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
